services:
  postgres:
    image: postgres:14-alpine
    container_name: traffic_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-traffic_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-traffic_password}
      POSTGRES_DB: ${POSTGRES_DB:-traffic_db}
      POSTGRES_INITDB_ARGS: -E UTF8
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server-backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-traffic_user} -d ${POSTGRES_DB:-traffic_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - traffic_network

  redis:
    image: redis:7-alpine
    container_name: traffic_redis
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - traffic_network

  server-backend:
    build:
      context: ./server-backend
      dockerfile: Dockerfile
    container_name: traffic_server_backend
    environment:
      ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      DEBUG: ${APP_DEBUG:-false}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DATABASE_URL: ${DATABASE_URL:-postgresql://traffic_user:traffic_password@postgres:5432/traffic_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      INGEST_API_KEY: ${INGEST_API_KEY:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)\"",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - traffic_network

  celery-worker:
    build:
      context: ./server-backend
      dockerfile: Dockerfile
    container_name: traffic_celery_worker
    command: celery -A app.celery_app:celery worker --loglevel=info
    environment:
      ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      DEBUG: ${APP_DEBUG:-false}
      DATABASE_URL: ${DATABASE_URL:-postgresql://traffic_user:traffic_password@postgres:5432/traffic_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      INGEST_API_KEY: ${INGEST_API_KEY:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      server-backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - traffic_network
    profiles:
      - workers

  celery-beat:
    build:
      context: ./server-backend
      dockerfile: Dockerfile
    container_name: traffic_celery_beat
    command: celery -A app.celery_app:celery beat --loglevel=info
    environment:
      ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      DEBUG: ${APP_DEBUG:-false}
      DATABASE_URL: ${DATABASE_URL:-postgresql://traffic_user:traffic_password@postgres:5432/traffic_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      INGEST_API_KEY: ${INGEST_API_KEY:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      server-backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - traffic_network
    profiles:
      - workers

  flower:
    build:
      context: ./server-backend
      dockerfile: Dockerfile
    container_name: traffic_flower
    command: celery -A app.celery_app:celery flower --port=5555
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    depends_on:
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_started
    restart: unless-stopped
    networks:
      - traffic_network
    profiles:
      - workers

  edge-backend:
    build:
      context: ./edge-backend
      dockerfile: Dockerfile
    container_name: traffic_edge_backend
    environment:
      CAMERA_RTSP_URL: ${CAMERA_RTSP_URL:-}
      SAVE_TO_DB: ${SAVE_TO_DB:-false}
      SAVE_TO_API: ${SAVE_TO_API:-true}
      REMOTE_API_BASE_URL: ${REMOTE_API_BASE_URL:-http://server-backend:8000}
      REMOTE_API_KEY: ${REMOTE_API_KEY:-}
      BRANCH_ID: ${BRANCH_ID:-default_branch}
      BRANCH_NAME: ${BRANCH_NAME:-Default Branch}
      SHOW_WINDOW: ${SHOW_WINDOW:-false}
      MAX_INGEST_QUEUE_SIZE: ${MAX_INGEST_QUEUE_SIZE:-10000}
      APPARENT_GENDER_ENABLED: ${APPARENT_GENDER_ENABLED:-true}
      GENDER_AUTO_DOWNLOAD_MODEL: ${GENDER_AUTO_DOWNLOAD_MODEL:-true}
      GENDER_MODEL_DIR: ${GENDER_MODEL_DIR:-models/gender}
      GENDER_MODEL_PROTOTXT: ${GENDER_MODEL_PROTOTXT:-}
      GENDER_MODEL_WEIGHTS: ${GENDER_MODEL_WEIGHTS:-}
      GENDER_SAMPLE_EVERY_N_FRAMES: ${GENDER_SAMPLE_EVERY_N_FRAMES:-10}
      GENDER_VOTE_WINDOW: ${GENDER_VOTE_WINDOW:-12}
      GENDER_MIN_VOTES: ${GENDER_MIN_VOTES:-5}
      GENDER_CONFIDENCE_THRESHOLD: ${GENDER_CONFIDENCE_THRESHOLD:-0.64}
      GENDER_AGGREGATE_CONFIDENCE_THRESHOLD: ${GENDER_AGGREGATE_CONFIDENCE_THRESHOLD:-0.67}
      GENDER_FEMALE_CONFIDENCE_THRESHOLD: ${GENDER_FEMALE_CONFIDENCE_THRESHOLD:-0.78}
      GENDER_LOCK_CONFIDENCE_THRESHOLD: ${GENDER_LOCK_CONFIDENCE_THRESHOLD:-0.72}
      GENDER_LOCK_MIN_VOTES: ${GENDER_LOCK_MIN_VOTES:-6}
      GENDER_FLIP_MARGIN: ${GENDER_FLIP_MARGIN:-0.18}
      GENDER_FLIP_MIN_VOTES: ${GENDER_FLIP_MIN_VOTES:-6}
      GENDER_STALE_TRACK_SECONDS: ${GENDER_STALE_TRACK_SECONDS:-25}
    depends_on:
      server-backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - traffic_network
    profiles:
      - edge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  traffic_network:
    driver: bridge
